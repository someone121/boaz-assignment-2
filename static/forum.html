<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartClass AI — Course Forum</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#fff8f0",
            caramel: "#c08552",
            mocha: "#8c5a3c",
            coffee: "#4b2e2b",
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#fff8f0] text-[#4b2e2b] min-h-screen">

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <header class="sticky top-0 z-30 backdrop-blur-md bg-[#fff8f0]/90 border-b border-[#8c5a3c]/15">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#c08552] to-[#8c5a3c] flex items-center justify-center text-[#fff8f0] font-bold text-sm shadow-sm">
          SC
        </div>
        <div>
          <h1 class="text-base font-bold text-[#4b2e2b]">Course Forum</h1>
          <p id="forum-user-label" class="text-xs text-[#8c5a3c]">Discussions &amp; replies</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a id="forum-back-dashboard-link" href="/" class="text-xs sm:text-sm font-semibold text-white bg-[#c08552] hover:bg-[#8c5a3c] px-4 py-2 rounded-xl transition shadow-sm">
          Back to Dashboard
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-7 space-y-6">

    <!-- Course Selector -->
    <section class="bg-white rounded-2xl border border-[#8c5a3c]/15 shadow-lg shadow-[#8c5a3c]/10 p-5 sm:p-6">
      <div class="flex items-center justify-between gap-3 mb-3">
        <h2 class="text-sm font-bold text-[#4b2e2b]">Your Courses</h2>
        <span id="forum-course-count" class="text-xs text-[#8c5a3c]"></span>
      </div>
      <div id="forum-course-tabs" role="tablist" aria-label="Select a course" class="flex flex-wrap gap-2">
        <span class="text-xs text-[#8c5a3c]">Loading your courses...</span>
      </div>
    </section>

    <!-- New Thread Composer (hidden until a course is selected) -->
    <section id="forum-composer" class="hidden bg-white rounded-2xl border border-[#8c5a3c]/15 shadow-lg shadow-[#8c5a3c]/10 p-6 sm:p-7">
      <h2 class="text-base font-bold text-[#4b2e2b] mb-1">Start a Discussion</h2>
      <p class="text-xs text-[#8c5a3c] mb-4">
        Posting in <span id="forum-composer-course" class="font-semibold text-[#4b2e2b]"></span>
      </p>
      <form id="forum-post-form" class="space-y-3.5">
        <input id="forum-post-title" type="text" maxlength="200" placeholder="Thread title" class="w-full rounded-2xl border border-[#8c5a3c]/25 bg-[#fff8f0]/40 px-4 py-2.5 text-sm text-[#4b2e2b] placeholder:text-[#8c5a3c]/50 focus:bg-white focus:ring-2 focus:ring-[#c08552] outline-none transition" />
        <textarea id="forum-post-content" rows="3" maxlength="10000" placeholder="Ask a question, share an insight, or start a conversation..." class="w-full rounded-2xl border border-[#8c5a3c]/25 bg-[#fff8f0]/40 px-4 py-3 text-sm text-[#4b2e2b] placeholder:text-[#8c5a3c]/50 focus:bg-white focus:ring-2 focus:ring-[#c08552] outline-none transition"></textarea>
        <div class="flex justify-end">
          <button id="forum-post-submit" type="submit" class="bg-[#c08552] hover:bg-[#8c5a3c] disabled:opacity-60 disabled:cursor-not-allowed text-white text-sm font-semibold px-6 py-2.5 rounded-2xl transition shadow-md shadow-[#c08552]/20">
            Post Thread
          </button>
        </div>
      </form>
    </section>

    <!-- Threads -->
    <section id="forum-feed" class="space-y-4" aria-live="polite"></section>

  </main>

  <script type="module" src="/static/js/forum.js"></script>
</body>
</html>
