<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartClass AI — Class Q&amp;A &amp; Summaries</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#fff8f0",
            caramel: "#c08552",
            mocha: "#8c5a3c",
            coffee: "#4b2e2b",
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#fff8f0] text-[#4b2e2b] min-h-screen">

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <header class="sticky top-0 z-30 backdrop-blur-md bg-[#fff8f0]/90 border-b border-[#8c5a3c]/15">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#c08552] to-[#8c5a3c] flex items-center justify-center text-[#fff8f0] font-bold text-sm shadow-sm">
          SC
        </div>
        <div>
          <h1 class="text-base font-bold text-[#4b2e2b]">Class Q&amp;A &amp; AI Summaries</h1>
          <p id="forum-ws-status" class="text-xs text-[#8c5a3c]">Live feed</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a id="forum-back-dashboard-link" href="/" class="text-xs sm:text-sm font-semibold text-white bg-[#c08552] hover:bg-[#8c5a3c] px-4 py-2 rounded-xl transition shadow-sm">
          Back to Dashboard
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-7 space-y-6">

    <!-- New Post Composer -->
    <section class="bg-white rounded-2xl border border-[#8c5a3c]/15 shadow-lg shadow-[#8c5a3c]/10 p-6 sm:p-7">
      <h2 class="text-base font-bold text-[#4b2e2b] mb-4">Ask a Question or Share a Class Note</h2>
      <form id="forum-post-form" class="space-y-3.5">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <input id="forum-author-name" type="text" required placeholder="Your Name" class="rounded-2xl border border-[#8c5a3c]/25 bg-[#fff8f0]/40 px-4 py-2.5 text-sm text-[#4b2e2b] focus:bg-white focus:ring-2 focus:ring-[#c08552] outline-none transition" />
          <select id="forum-author-role" class="rounded-2xl border border-[#8c5a3c]/25 bg-[#fff8f0]/40 px-4 py-2.5 text-sm text-[#4b2e2b] focus:bg-white focus:ring-2 focus:ring-[#c08552] outline-none transition">
            <option value="student">Student</option>
            <option value="lecturer">Lecturer</option>
          </select>
          <select id="forum-post-type" class="rounded-2xl border border-[#8c5a3c]/25 bg-[#fff8f0]/40 px-4 py-2.5 text-sm text-[#4b2e2b] focus:bg-white focus:ring-2 focus:ring-[#c08552] outline-none transition">
            <option value="question">Question</option>
            <option value="note">Class Note / Suggestion</option>
          </select>
        </div>
        <textarea id="forum-content" rows="3" placeholder="Write your question, insight, or lecture note..." class="w-full rounded-2xl border border-[#8c5a3c]/25 bg-[#fff8f0]/40 px-4 py-3 text-sm text-[#4b2e2b] placeholder:text-[#8c5a3c]/50 focus:bg-white focus:ring-2 focus:ring-[#c08552] outline-none transition"></textarea>
        <div class="flex justify-end">
          <button type="submit" class="bg-[#c08552] hover:bg-[#8c5a3c] text-white text-sm font-semibold px-6 py-2.5 rounded-2xl transition shadow-md shadow-[#c08552]/20">
            Post to Class Feed
          </button>
        </div>
      </form>
    </section>

    <!-- Filter Chips -->
    <div class="flex flex-wrap gap-2">
      <button data-filter="all" class="forum-filter-btn px-4 py-2 rounded-full text-xs font-semibold bg-[#4b2e2b] text-[#fff8f0] transition shadow-sm">All</button>
      <button data-filter="question" class="forum-filter-btn px-4 py-2 rounded-full text-xs font-semibold bg-white border border-[#8c5a3c]/20 text-[#8c5a3c] hover:text-[#4b2e2b] transition">Questions</button>
      <button data-filter="ai_summary" class="forum-filter-btn px-4 py-2 rounded-full text-xs font-semibold bg-white border border-[#8c5a3c]/20 text-[#8c5a3c] hover:text-[#4b2e2b] transition">AI Summaries</button>
      <button data-filter="note" class="forum-filter-btn px-4 py-2 rounded-full text-xs font-semibold bg-white border border-[#8c5a3c]/20 text-[#8c5a3c] hover:text-[#4b2e2b] transition">Notes</button>
    </div>

    <!-- Chronological Feed -->
    <section id="forum-feed" class="space-y-4"></section>

  </main>

  <script type="module" src="/static/js/forum.js"></script>
</body>
</html>
