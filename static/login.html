<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartClass AI — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#fff8f0",
            caramel: "#c08552",
            mocha: "#8c5a3c",
            coffee: "#4b2e2b",
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen bg-[#fff8f0] text-[#4b2e2b] flex items-center justify-center p-5">

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <div class="w-full max-w-md space-y-6">
    <!-- Brand Header -->
    <div class="text-center space-y-3">
      <div class="mx-auto w-16 h-16 rounded-2xl bg-gradient-to-br from-[#c08552] to-[#8c5a3c] flex items-center justify-center text-[#fff8f0] font-bold text-xl shadow-lg shadow-[#8c5a3c]/25">
        SC
      </div>
      <h1 class="text-3xl font-bold tracking-tight text-[#4b2e2b]">SmartClass AI</h1>
      <p class="text-sm text-[#8c5a3c]">Welcome back — sign in with your ID to enter your warm classroom workspace</p>
    </div>

    <!-- Active Session Banner -->
    <div id="already-signed-in" class="hidden rounded-2xl bg-white border border-[#c08552]/35 p-5 shadow-lg shadow-[#8c5a3c]/10 flex items-center justify-between gap-4">
      <div class="text-xs space-y-0.5">
        <p class="text-[#8c5a3c] font-medium">Currently signed in as</p>
        <p id="current-user-label" class="font-bold text-sm text-[#4b2e2b]"></p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="continue-session-btn" type="button" class="bg-[#c08552] hover:bg-[#8c5a3c] text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow-sm">
          Continue
        </button>
        <button id="switch-account-btn" type="button" class="text-xs font-semibold text-[#8c5a3c] hover:text-[#4b2e2b] px-2.5 py-2 rounded-xl hover:bg-[#fff8f0] transition">
          Sign Out
        </button>
      </div>
    </div>

    <!-- Main Login Card -->
    <div class="bg-white rounded-2xl border border-[#8c5a3c]/15 shadow-lg shadow-[#8c5a3c]/10 p-7 sm:p-8 space-y-6">

      <!-- Role Selector -->
      <div class="grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-[#fff8f0] border border-[#8c5a3c]/15">
        <button type="button" id="role-student-btn" data-role="student" class="role-btn py-2.5 rounded-xl text-sm font-semibold bg-[#c08552] text-white shadow-sm transition">
          Student
        </button>
        <button type="button" id="role-lecturer-btn" data-role="lecturer" class="role-btn py-2.5 rounded-xl text-sm font-medium text-[#8c5a3c] hover:text-[#4b2e2b] transition">
          Lecturer
        </button>
      </div>

      <div id="login-error" class="hidden rounded-2xl bg-rose-50 border border-rose-200 px-4 py-3 text-xs font-semibold text-rose-800"></div>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="id-number-input" class="block text-xs font-semibold text-[#8c5a3c] uppercase tracking-wider mb-1.5">
            ID Number (ת.ז)
          </label>
          <input
            id="id-number-input"
            type="text"
            required
            autocomplete="username"
            placeholder="e.g. 212418735"
            class="w-full rounded-2xl border border-[#8c5a3c]/25 bg-[#fff8f0]/40 px-4 py-3 text-sm font-mono text-[#4b2e2b] placeholder:text-[#8c5a3c]/50 focus:bg-white focus:ring-2 focus:ring-[#c08552] focus:border-[#c08552] outline-none transition"
          />
        </div>

        <div>
          <label for="full-name-input" class="block text-xs font-semibold text-[#8c5a3c] uppercase tracking-wider mb-1.5">
            Full Name <span class="text-[#8c5a3c]/70 font-normal normal-case">(for first-time login)</span>
          </label>
          <input
            id="full-name-input"
            type="text"
            autocomplete="name"
            placeholder="e.g. Ron Perelman"
            class="w-full rounded-2xl border border-[#8c5a3c]/25 bg-[#fff8f0]/40 px-4 py-3 text-sm text-[#4b2e2b] placeholder:text-[#8c5a3c]/50 focus:bg-white focus:ring-2 focus:ring-[#c08552] focus:border-[#c08552] outline-none transition"
          />
        </div>

        <div id="password-field-wrap" class="hidden">
          <label for="password-input" class="block text-xs font-semibold text-[#8c5a3c] uppercase tracking-wider mb-1.5">
            Lecturer Password
          </label>
          <input
            id="password-input"
            type="password"
            autocomplete="current-password"
            placeholder="Required for lecturer access"
            class="w-full rounded-2xl border border-[#8c5a3c]/25 bg-[#fff8f0]/40 px-4 py-3 text-sm text-[#4b2e2b] placeholder:text-[#8c5a3c]/50 focus:bg-white focus:ring-2 focus:ring-[#c08552] focus:border-[#c08552] outline-none transition"
          />
        </div>

        <button
          id="login-submit-btn"
          type="submit"
          class="w-full bg-[#c08552] hover:bg-[#8c5a3c] text-white font-semibold py-3.5 rounded-2xl transition shadow-md shadow-[#c08552]/25 text-sm"
        >
          Sign In as Student
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-[#8c5a3c]">
      SmartClass AI &middot; Cozy KISS Classroom Suite
    </p>
  </div>

  <script type="module" src="/static/js/login.js"></script>
</body>
</html>
