services:
  smartclass-app:
    build: .
    container_name: smartclass_ai
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///./data/smartclass.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-supersecret_kiss_key}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Default lecturer seeded on startup and assigned to the 3 default courses.
      - DEFAULT_LECTURER_ID=111111111
      - DEFAULT_LECTURER_NAME=Default Lecturer
      - DEFAULT_LECTURER_PASSWORD=admin123
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    restart: unless-stopped
